<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margarida House | Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- FIVICON -->
    <link rel="icon" type="image/png" sizes="128x128" href="img/android-chrome-192x192.png">


</head>

<body>
    <div class="login-box">

        <div class="logo">
            <img src="img/logo.png" alt="Logo Margarita House">
            <h1>Margarita House</h1>
            <p>Área exclusiva para hóspedes</p>
        </div>

        <form onsubmit="return login(event)">

            <div class="input-box">
                <input type="email" id="email" required>
                <label>Email</label>
                <i class="fas fa-envelope"></i>
            </div>

            <div class="input-box">
                <input type="password" id="senha" required>
                <label>Senha</label>
                <i class="fas fa-lock"></i>
            </div>

            <div class="options">

                <label>
                    <input type="checkbox">
                    Lembrar-me
                </label>

                <a href="#">Esqueceu a senha?</a>

            </div>
            <button type="submit" class="btn-login">
                Entrar
            </button>
        </form>

    </div>

    <script src="script.js"></script>
</body>

</html>
